# Stable global Codex preferences managed by skill-lighting-up.
# Machine-local sections such as auth, project trust, marketplace cache paths,
# notifications, and bundled MCP paths are intentionally not stored here.

model = "gpt-5.5"
model_reasoning_effort = "xhigh"

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[desktop]
localeOverride = "zh-CN"

[desktop.open-in-target-preferences]
global = "fileManager"

[features]
js_repl = false
